<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Research Landing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #ffffff;
      overflow-x: hidden;
    }

    .hero-section {
      padding: 120px 70px;
    }

    .tag {
      display: inline-block;
      background: #dff6e8;
      color: #2e8b57;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .title {
      font-size: 60px;
      font-weight: 700;
      color: #1e1e2d;
      line-height: 1.15;
      max-width: 600px;
    }

    .subtitle {
      color: #4f4f63;
      font-size: 18px;
      max-width: 550px;
      margin-top: 20px;
    }

    .btn-start {
      background: #29cc6d;
      color: #fff;
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      font-weight: 600;
      margin-right: 10px;
    }

    .btn-login {
      background: transparent;
      border: 2px solid #29cc6d;
      color: #29cc6d;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 600;
    }

    .right-img img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body style="background:#f5f5f5; padding:40px;">

<div class="container" style="max-width:1300px; background:white; padding:70px 80px; border-radius:25px; box-shadow:0 12px 35px rgba(0,0,0,0.12); margin-bottom:40px;">

<section class="hero-section container-fluid" style="padding:0;">
  <div class="row align-items-center">

    <div class="col-md-6">
      <span class="tag">LABORATORY</span>

      <h1 class="title">Space Physics <br> Research Laboratory</h1>

      <p class="subtitle">
        Committed to knowledge dissemination, our laboratory is dedicated to educate next generation space scientists.
      </p>

      <div class="mt-4">
        <button class="btn-start">Get Started</button>
        <button class="btn-login">Login</button>
      </div>
    </div>

    <div class="col-md-6 right-img text-center">
      <img src="lab.png" alt="Laboratory Image" style="width:115%; margin-left:-20px; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,0.2);""Laboratory Image" style="width:130%; margin-left:-60px; border-radius:22px; box-shadow:0 10px 35px rgba(0,0,0,0.25);""Laboratory Image" style="width:115%; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,0.2);""Laboratory Image" style="width:100%; border-radius:18px; box-shadow:0 6px 20px rgba(0,0,0,0.15);">
    </div>

  </div>
</section>

</div>

</body>
</html>
