version: '3.8'
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/lab_management
      - SESSION_SECRET=change_me
    depends_on:
      - mongo
    volumes:
      - ./:/usr/src/app
      - ./public/uploads:/usr/src/app/public/uploads
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
